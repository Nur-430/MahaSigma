name: Build and Release MahaSigma APK

# Workflow ini akan berjalan otomatis setiap kali ada tag baru yang diawali huruf 'v' (contoh: v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17' # Sesuaikan jika kamu menggunakan versi Java yang berbeda
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Catatan: Kita menggunakan assembleDebug agar APK bisa langsung di-build dan diinstal tanpa setup Keystore/Password di awal.
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          # Pastikan path ini sesuai dengan struktur foldermu
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}